<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<title>仕入れ・売価</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>仕入れ・売価</h1>
  <span id="syncState" class="sync"></span>
  <button id="btnSettings" class="icon-btn" aria-label="設定">⚙</button>
</header>
<div id="warn" class="warn" hidden></div>

<main>
  <section id="tab-calc" class="tab"></section>
  <section id="tab-review" class="tab" hidden></section>
  <section id="tab-history" class="tab" hidden></section>
  <section id="tab-products" class="tab" hidden></section>
</main>

<nav class="tabs">
  <button data-tab="calc" class="on"><span>🧮</span>計算・入力</button>
  <button data-tab="review"><span>⚠</span>見直し<b id="reviewCount" class="badge" hidden></b></button>
  <button data-tab="history"><span>📋</span>履歴</button>
  <button data-tab="products"><span>🌾</span>商品</button>
</nav>

<div id="modal" class="modal" hidden><div class="sheet" id="modalBody"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
